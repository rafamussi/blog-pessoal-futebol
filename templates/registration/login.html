{% extends 'base.html' %}

{% block title %}Entrar | Minha Trajetória no Futebol{% endblock %}

{% block content %}
<h2>Entrar</h2>

{% if form.errors %}
<p class="errorlist">Usuário ou senha incorretos. Tente novamente.</p>
{% endif %}

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="actions">
        <button type="submit">Entrar</button>
        <a class="button secondary" href="{% url 'post_list' %}">Cancelar</a>
    </div>
</form>
{% endblock %}
