{% extends 'base.html' %}

{% block title %}Remover post | Minha Trajetória no Futebol{% endblock %}

{% block content %}
<h2>Remover post</h2>

<p>Tem certeza de que deseja remover o post <strong>{{ post.title }}</strong>? Esta ação não pode ser desfeita.</p>

<form method="post">
    {% csrf_token %}
    <div class="actions">
        <button type="submit" class="danger">Sim, remover</button>
        <a class="button secondary" href="{% url 'post_detail' post.pk %}">Cancelar</a>
    </div>
</form>
{% endblock %}
